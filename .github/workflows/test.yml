name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Library tests
        run: npm test
      - name: JSON API is up to date
        run: |
          npm run build:api
          git diff --exit-code -- api/ || (echo "api/ is stale: run 'npm run build:api' and commit the result" && exit 1)
